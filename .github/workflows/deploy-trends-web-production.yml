name: Deploy Production Trends Web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-trends-web
  cancel-in-progress: false

jobs:
  validate-release-ref:
    name: Require a release branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected branch
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/.+ ]]; then
            echo "::error::Select a release/* branch to deploy Production."
            exit 1
          fi

  build:
    name: Build Production candidates
    needs: validate-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/trends/trends-api/workers/package-lock.json
            workspace/site-hosting/sites/www-bloggenius-kr/package-lock.json
      - name: Validate and dry-run the Production Trends API
        working-directory: apps/trends/trends-api/workers
        run: |
          npm ci
          npm test
          npx wrangler deploy --env production --dry-run
      - name: Build the Production site artifact
        working-directory: workspace/site-hosting/sites/www-bloggenius-kr
        env:
          BLOGGENIUS_ENV: production
          BLOGGENIUS_SITE_URL: https://www.bloggenius.kr
          PUBLIC_TRENDS_API_BASE_URL: https://trendapi.bloggenius.kr
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          grep -R -l --include='*.html' --include='*.js' --include='*.css' 'https://trendapi.bloggenius.kr' dist
          grep -R -l --include='*.html' --include='*.js' --include='*.css' 'https://www.bloggenius.kr' dist
          if grep -R -n -E --include='*.html' --include='*.js' --include='*.css' 'www-dev\.bloggenius\.kr|trendapi-dev\.bloggenius\.kr' dist; then
            echo '::error::Development hostnames were found in the Production site artifact.'
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: production-trends-site-${{ github.sha }}
          path: workspace/site-hosting/sites/www-bloggenius-kr/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy approved Production candidates
    needs: [validate-release-ref, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      BLOGGENIUS_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.TRENDS_SUPABASE_SECRET_KEY }}
      TRENDS_API_TOKEN: ${{ secrets.TRENDS_API_TOKEN }}
      TRENDS_READ_TOKEN_SECRET: ${{ secrets.TRENDS_READ_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify Production deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_SECRET_KEY TRENDS_API_TOKEN TRENDS_READ_TOKEN_SECRET)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure ${name} in the GitHub production Environment."
              exit 1
            fi
          done
      - name: Install Cloudflare deployment dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify exact Production Workers and hostname ownership
        run: node scripts/deploy-production-trends-site.js --preflight
      - name: Install Trends API Worker dependencies
        working-directory: apps/trends/trends-api/workers
        run: npm ci
      - name: Deploy the Production Trends API Worker
        working-directory: apps/trends/trends-api/workers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/trends-api-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'const fs = require("node:fs"); const names = ["SUPABASE_SECRET_KEY", "TRENDS_API_TOKEN", "TRENDS_READ_TOKEN_SECRET"]; fs.writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))), { mode: 0o600 });' "$secrets_file"
          npx wrangler deploy --env production --secrets-file "$secrets_file"
      - name: Verify both Production Trends API hostnames
        run: node scripts/production-trends-web-smoke.js api
      - uses: actions/download-artifact@v7
        with:
          name: production-trends-site-${{ github.sha }}
          path: workspace/site-hosting/sites/www-bloggenius-kr/dist/
      - name: Deploy the existing Production site Worker
        run: node scripts/deploy-production-trends-site.js
      - name: Verify the Production site
        run: node scripts/production-trends-web-smoke.js site
