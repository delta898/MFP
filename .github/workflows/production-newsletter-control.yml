name: Production | Emergency Disable Newsletter Delivery

on:
  workflow_dispatch:
    inputs:
      confirm_disable:
        description: Type DISABLE to block Production newsletter delivery immediately
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-newsletter-control
  cancel-in-progress: false

jobs:
  disable:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BLOGGENIUS_PRODUCTION_SUPABASE_PROJECT_REF: hocfjolcthvtgfaxjmse
      CONFIRM_DISABLE: ${{ inputs.confirm_disable }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0-beta.17
      - name: Require an explicit emergency disable confirmation
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Configure SUPABASE_ACCESS_TOKEN in production.'; exit 1; }
          test "$CONFIRM_DISABLE" = DISABLE || { echo '::error::Type DISABLE to continue.'; exit 1; }
      - name: Disable Production newsletter delivery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/newsletter-mode.XXXXXX.env")"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'BLOGGENIUS_ENV=production\nNEWSLETTER_EMAIL_MODE=disabled\n' > "$secrets_file"
          supabase secrets set --env-file "$secrets_file" --project-ref "$BLOGGENIUS_PRODUCTION_SUPABASE_PROJECT_REF" --yes
