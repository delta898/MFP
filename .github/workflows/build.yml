name: Build BlogGenius Release Assets

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mirror_repo: ${{ steps.check_mirror.outputs.mirror_repo }}
      mirror_repo_pat: ${{ steps.check_mirror.outputs.has_pat }}
      app_version: ${{ steps.release_meta.outputs.app_version }}
      version_clean: ${{ steps.release_meta.outputs.version_clean }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
      release_body: ${{ steps.release_meta.outputs.release_body }}
      release_details_json: ${{ steps.release_meta.outputs.release_details_json }}
    steps:
      - uses: actions/checkout@v6
      - id: release_meta
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME}"
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* || "${GITHUB_REF_NAME}" == *"-alpha"* || "${GITHUB_REF_NAME}" == *"-dev"* || "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            PRERELEASE=true
          fi
          DETAILS_JSON=$(node scripts/release-details.js "${VERSION_CLEAN}")
          RELEASE_BODY=$(DETAILS_JSON="$DETAILS_JSON" node <<'NODE'
          try {
            const details = JSON.parse(process.env.DETAILS_JSON || '{}');
            const body = Array.isArray(details.highlights) && details.highlights.length > 0
              ? details.highlights.join('\n')
              : (details.summary || '');
            process.stdout.write(body);
          } catch (_) {
            process.stdout.write('');
          }
          NODE
          )
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_clean=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<EOF"
            printf '%s\n' "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "release_details_json<<EOF"
            printf '%s\n' "$DETAILS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: check_mirror
        run: |
          echo "mirror_repo=delta898/NaverAutoBlog-Releases" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.MIRROR_REPO_PAT }}" != "" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: setup
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - name: Create or Update Private Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.setup.outputs.release_body }}
          overwrite_files: true
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.setup.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Mirror Release
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.setup.outputs.release_body }}
          overwrite_files: true
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.setup.outputs.prerelease != 'true' }}

  build_and_upload:
    name: Build & Upload ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    needs: [setup, create_release]
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
      APP_VERSION: ${{ needs.setup.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: Linux x64
            suffix: linux-x64
          - os: macos-15-intel
            platform_name: macOS Intel
            suffix: mac-intel
          - os: macos-15
            platform_name: macOS Apple Silicon
            suffix: mac-arm64
          - os: windows-2025
            platform_name: Windows x64
            suffix: win-x64

    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Install Inno Setup (Windows)
        if: matrix.suffix == 'win-x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create secret.js
        shell: bash
        env:
          BLOGGENIUS_BUILD_SUPABASE_URL: ${{ secrets.LICENSE_CHK_URL }}
          BLOGGENIUS_BUILD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LICENSE_CHK_KEY }}
          BLOGGENIUS_BUILD_TRENDS_API_URL: ${{ vars.BLOGGENIUS_PRODUCTION_TRENDS_API_URL }}
          BLOGGENIUS_BUILD_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          BLOGGENIUS_BUILD_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          node scripts/build-environment-config.js write \
            --target production \
            --output src/config/secret.js
          node scripts/build-environment-config.js validate \
            --target production \
            --input src/config/secret.js

      - name: Build GUI App
        shell: bash
        run: |
          APP_NAME="BlogGenius"
          if [[ "${{ matrix.suffix }}" == "linux-x64" ]]; then
            E_PLAT="linux"; E_ARCH="x64"
            APP_ICON="assets/icons/icon.png"
          elif [[ "${{ matrix.suffix }}" == "mac-intel" ]]; then
            E_PLAT="darwin"; E_ARCH="x64"
            APP_ICON="assets/icons/icon.icns"
          elif [[ "${{ matrix.suffix }}" == "mac-arm64" ]]; then
            E_PLAT="darwin"; E_ARCH="arm64"
            APP_ICON="assets/icons/icon.icns"
          elif [[ "${{ matrix.suffix }}" == "win-x64" ]]; then
            E_PLAT="win32"; E_ARCH="x64"
            APP_ICON="assets/icons/icon.ico"
          fi
          npx --no-install electron-packager . ${APP_NAME} --platform=${E_PLAT} --arch=${E_ARCH} --out=dist/gui-temp --overwrite --asar.unpack="**/{node_modules/sharp,node_modules/@img,node_modules/kuzu}/**/*" --icon="${APP_ICON}" --ignore="^/([.]git|dist|logs|data|config|Videos|workspace|supabase|temp|docs|tmp|tmp_update|tests|testscripts|test_images|scripts|sql|apps|wordpress|NaverBlogAutoTool|BlogGenius.app|BlogGenius-cli|BlogGenius-cli.exe)($|/)|^/(debug_.*|trend_structure_dump[.]html|jobs[.]xlsx|topics.*[.]xlsx|topics 2[.]numbers|[.]DS_Store)$|(?:[.]zip|[.]tar[.]gz|[.]bak|[.]numbers|[.]dmg|[.]old|[.]build_stamp_.*)$|/node_modules/(electron|electron-packager|[.]cache)($|/)"

          PACKAGED_APP_DIR=$(find dist/gui-temp -mindepth 1 -maxdepth 1 -type d -name "${APP_NAME}-*" -print -quit)
          if [[ -z "${PACKAGED_APP_DIR}" || ! -d "${PACKAGED_APP_DIR}" ]]; then
            echo "::error::electron-packager completed without creating an application directory."
            exit 1
          fi

          # Kuzu ships its full source tree, tests, and datasets inside the npm package.
          # The install step already copies the runtime JS files and native module to
          # node_modules/kuzu, so the source tree is not needed in packaged apps. Keeping
          # it also creates very long Windows installer paths that Inno Setup cannot handle.
          find "${PACKAGED_APP_DIR}" -path "*/app.asar.unpacked/node_modules/kuzu/kuzu-source" -prune -exec rm -rf {} +

          echo "PACKAGED_APP_DIR=${PACKAGED_APP_DIR}" >> "$GITHUB_ENV"

      - name: Code Sign (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          APP_PATH="${PACKAGED_APP_DIR}/BlogGenius.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Packaged macOS application not found: ${APP_PATH}"
            exit 1
          fi
          codesign --sign - --force --deep "$APP_PATH"

      - name: Finalize Directory Structure (Naming Rule)
        shell: bash
        run: |
          # 1. 압축 내부 루트는 버전별로 유지, 릴리즈 asset 파일명은 플랫폼 고정 이름 사용
          ROOT_NAME="BlogGenius-${APP_VERSION}-${{ matrix.suffix }}"
          ROOT_OUT="dist/${ROOT_NAME}"
          PORTABLE_ZIP_NAME="BlogGenius-${{ matrix.suffix }}.zip"
          mkdir -p "${ROOT_OUT}/config/images" "${ROOT_OUT}/data"

          # 2. 필수 리소스 복사
          cp config/config.json.sample "${ROOT_OUT}/config/config.json.sample"
          cp -r config/images/* "${ROOT_OUT}/config/images/" || true
          [ -f "README.md" ] && cp README.md "${ROOT_OUT}/README.md" || echo "# BlogGenius" > "${ROOT_OUT}/README.md"
          
          # 3. GUI 배치
          APP_NAME="BlogGenius"
          if [[ "${{ matrix.suffix }}" == "mac-"* ]]; then
            cp -r "${PACKAGED_APP_DIR}/${APP_NAME}.app" "${ROOT_OUT}/"
          elif [[ "${{ matrix.suffix }}" == "linux-x64" ]]; then
            mkdir -p "${ROOT_OUT}/lib"
            cp -a "${PACKAGED_APP_DIR}/." "${ROOT_OUT}/lib/"
            mv "${ROOT_OUT}/lib/${APP_NAME}" "${ROOT_OUT}/lib/${APP_NAME}-bin"
            echo -e "#!/bin/bash\nHERE=\"\$(dirname \"\$(readlink -f \"\$0\")\")\"\nexport LD_LIBRARY_PATH=\"\$HERE/lib:\$LD_LIBRARY_PATH\"\n\"\$HERE/lib/${APP_NAME}-bin\" \"\$@\"" > "${ROOT_OUT}/${APP_NAME}"
            chmod +x "${ROOT_OUT}/${APP_NAME}" "${ROOT_OUT}/lib/${APP_NAME}-bin"
          elif [[ "${{ matrix.suffix }}" == "win-x64" ]]; then
            cp -a "${PACKAGED_APP_DIR}/." "${ROOT_OUT}/"
          fi
          
          # 4. ZIP 생성을 위해 원본 dist 정리 (ROOT_OUT만 남김)
          mv "${ROOT_OUT}" "dist-final"
          rm -rf dist/*
          mv "dist-final" "dist/${ROOT_NAME}"
          echo "ROOT_NAME=${ROOT_NAME}" >> $GITHUB_ENV
          echo "ROOT_OUT=dist/${ROOT_NAME}" >> $GITHUB_ENV
          echo "ZIP_NAME=${PORTABLE_ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_DIR=${ROOT_NAME}" >> $GITHUB_ENV

      - name: Create ZIP (non-Windows)
        if: startsWith(matrix.os, 'windows') == false
        shell: bash
        run: cd dist && zip -r "../${ZIP_NAME}" "${ZIP_DIR}" && cd ..

      - name: Create ZIP (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "${env:ZIP_NAME}" -Force

      - name: Build Windows Installer
        if: matrix.suffix == 'win-x64'
        shell: pwsh
        run: |
          $setupName = "BlogGenius-win-x64"
          $sourceDir = (Resolve-Path $env:ROOT_OUT).Path
          $outputDir = (Resolve-Path ".").Path
          $setupIcon = (Resolve-Path "assets/icons/icon.ico").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc `
            "/DMyAppVersion=${env:APP_VERSION}" `
            "/DMySourceDir=$sourceDir" `
            "/DMyOutputDir=$outputDir" `
            "/DMyOutputBaseFilename=$setupName" `
            "/DMySetupIcon=$setupIcon" `
            "scripts/windows/BlogGeniusSetup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed with exit code $LASTEXITCODE"
          }
          "SETUP_EXE_NAME=${setupName}.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload portable asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer to Release
        if: matrix.suffix == 'win-x64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.SETUP_EXE_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable asset to Mirror
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          overwrite_files: true

      - name: Upload Windows installer to Mirror
        if: matrix.suffix == 'win-x64' && needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.SETUP_EXE_NAME }}
          overwrite_files: true

      - name: Build Asset Metadata
        shell: bash
        run: |
          META_FILE="asset-meta-${{ matrix.suffix }}.json"
          ZIP_PATH="${ZIP_NAME}" META_FILE="${META_FILE}" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const zipPath = String(process.env.ZIP_PATH || '').trim();
          const metaFile = String(process.env.META_FILE || '').trim();

          if (!zipPath) {
            throw new Error('ZIP_NAME is empty');
          }
          if (!metaFile) {
            throw new Error('META_FILE is empty');
          }

          const buffer = fs.readFileSync(zipPath);
          const payload = {
            name: path.basename(zipPath),
            sha256: crypto.createHash('sha256').update(buffer).digest('hex'),
            size: fs.statSync(zipPath).size
          };

          fs.writeFileSync(metaFile, JSON.stringify(payload, null, 2));
          NODE

      - name: Upload Asset Metadata
        uses: actions/upload-artifact@v6
        with:
          name: asset-meta-${{ matrix.suffix }}
          path: asset-meta-${{ matrix.suffix }}.json
          if-no-files-found: error

  upload_readme:
    name: Upload Versioned README
    runs-on: ubuntu-latest
    needs: [setup, create_release]
    steps:
      - uses: actions/checkout@v6
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          README_OUT="README_v${VERSION}.md"
          [ -f "README.md" ] && cp README.md "${README_OUT}" || echo "# BlogGenius" > "${README_OUT}"
          echo "README_FILE=${README_OUT}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.README_FILE }}

  publish_update_manifest:
    name: Publish update.json
    runs-on: ubuntu-latest
    needs: [setup, build_and_upload]
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
      RELEASE_DETAILS_JSON: ${{ needs.setup.outputs.release_details_json }}
      RELEASE_BODY: ${{ needs.setup.outputs.release_body }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: .asset-meta

      - name: Fetch Private Release Metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} > private-release.json

      - name: Generate Private update.json
        shell: bash
        run: |
          node <<'NODE' > update.json
          const fs = require('fs');
          const path = require('path');

          const release = JSON.parse(fs.readFileSync('private-release.json', 'utf8'));
          const details = JSON.parse(process.env.RELEASE_DETAILS_JSON || '{}');
          const body = String(process.env.RELEASE_BODY || '');
          const metaDir = path.join(process.cwd(), '.asset-meta');
          const metaMap = new Map();

          function readMetaFiles(dirPath) {
            if (!fs.existsSync(dirPath)) return;
            for (const entry of fs.readdirSync(dirPath, { withFileTypes: true })) {
              const fullPath = path.join(dirPath, entry.name);
              if (entry.isDirectory()) {
                readMetaFiles(fullPath);
                continue;
              }
              if (!entry.name.endsWith('.json')) continue;
              try {
                const parsed = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
                if (parsed && parsed.name) metaMap.set(parsed.name, parsed);
              } catch (_) {}
            }
          }

          readMetaFiles(metaDir);

          const assets = Array.isArray(release.assets) ? release.assets : [];
          const payload = {
            tag_name: release.tag_name,
            published_at: release.published_at,
            prerelease: Boolean(release.prerelease),
            body,
            details,
            assets: assets
              .filter((asset) => {
                const name = String(asset.name || '').toLowerCase();
                return name.endsWith('.zip');
              })
              .map((asset) => {
                const meta = metaMap.get(asset.name) || {};
                return {
                  name: asset.name,
                  browser_download_url: asset.browser_download_url,
                  sha256: String(meta.sha256 || '').trim(),
                  size: Number(meta.size || asset.size || 0)
                };
              })
          };

          process.stdout.write(JSON.stringify(payload, null, 2));
          NODE

      - name: Upload Private update.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: update.json
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Mirror Release Metadata
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        env:
          GITHUB_TOKEN: ${{ env.MIRROR_REPO_PAT }}
        run: gh api repos/${{ env.MIRROR_REPO }}/releases/tags/${{ github.ref_name }} > mirror-release.json

      - name: Generate Mirror update.json
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        shell: bash
        run: |
          node <<'NODE' > update.json
          const fs = require('fs');
          const path = require('path');

          const release = JSON.parse(fs.readFileSync('mirror-release.json', 'utf8'));
          const details = JSON.parse(process.env.RELEASE_DETAILS_JSON || '{}');
          const body = String(process.env.RELEASE_BODY || '');
          const metaDir = path.join(process.cwd(), '.asset-meta');
          const metaMap = new Map();

          function readMetaFiles(dirPath) {
            if (!fs.existsSync(dirPath)) return;
            for (const entry of fs.readdirSync(dirPath, { withFileTypes: true })) {
              const fullPath = path.join(dirPath, entry.name);
              if (entry.isDirectory()) {
                readMetaFiles(fullPath);
                continue;
              }
              if (!entry.name.endsWith('.json')) continue;
              try {
                const parsed = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
                if (parsed && parsed.name) metaMap.set(parsed.name, parsed);
              } catch (_) {}
            }
          }

          readMetaFiles(metaDir);

          const assets = Array.isArray(release.assets) ? release.assets : [];
          const payload = {
            tag_name: release.tag_name,
            published_at: release.published_at,
            prerelease: Boolean(release.prerelease),
            body,
            details,
            assets: assets
              .filter((asset) => {
                const name = String(asset.name || '').toLowerCase();
                return name.endsWith('.zip');
              })
              .map((asset) => {
                const meta = metaMap.get(asset.name) || {};
                return {
                  name: asset.name,
                  browser_download_url: asset.browser_download_url,
                  sha256: String(meta.sha256 || '').trim(),
                  size: Number(meta.size || asset.size || 0)
                };
              })
          };

          process.stdout.write(JSON.stringify(payload, null, 2));
          NODE

      - name: Upload Mirror update.json
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: update.json
          overwrite_files: true

  cleanup_old_releases:
    name: Cleanup Old Releases (-3 Rule)
    runs-on: ubuntu-latest
    needs: [setup, build_and_upload, upload_readme, publish_update_manifest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIRROR_REPO: delta898/NaverAutoBlog-Releases
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - uses: actions/checkout@v6
      - name: Cleanup Private
        run: |
          gh release list -R "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName,isDraft,isPrerelease,createdAt,publishedAt \
            | node scripts/release-retention.js - 3 \
            | while IFS= read -r tag; do
              [ -n "${tag}" ] && gh release delete "${tag}" -R "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            done
      - name: Cleanup Mirror
        if: needs.setup.outputs.mirror_repo_pat == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MIRROR_REPO_PAT }}
        run: |
          gh release list -R "${MIRROR_REPO}" --limit 100 \
            --json tagName,isDraft,isPrerelease,createdAt,publishedAt \
            | node scripts/release-retention.js - 3 \
            | while IFS= read -r tag; do
              [ -n "${tag}" ] && gh release delete "${tag}" -R "${MIRROR_REPO}" --yes --cleanup-tag
            done
