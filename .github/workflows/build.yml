name: Build BlogGenius Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 1. 리눅스
          - os: ubuntu-latest
            target: node18-linux-x64
            output_binary: BlogGenius-linux
            platform_name: linux-x64
            zip_name: BlogGenius-linux-x64.zip
            
          # 2. 맥 (Intel)
          - os: macos-latest
            target: node18-macos-x64
            output_binary: BlogGenius-mac-intel
            platform_name: mac-intel
            zip_name: BlogGenius-mac-intel.zip
            
          # 3. 맥 (Apple Silicon - M1/M2/M3)
          - os: macos-latest
            target: node18-macos-arm64
            output_binary: BlogGenius-mac-arm64
            platform_name: mac-arm64
            zip_name: BlogGenius-mac-arm64.zip

          # 4. 윈도우
          - os: windows-latest
            target: node18-win-x64
            output_binary: BlogGenius.exe
            platform_name: win-x64
            zip_name: BlogGenius-win-x64.zip

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Install pkg
      run: npm install -g pkg

    - name: Create secret.js
      shell: bash
      run: |
        mkdir -p src/config
        echo "module.exports = { LICENSE_CHK_URL: '${{ secrets.LICENSE_CHK_URL }}', LICENSE_CHK_KEY: '${{ secrets.LICENSE_CHK_KEY }}' };" > src/config/secret.js

    # 바이너리 빌드
    - name: Build Executable
      run: |
        pkg src/main.js --targets ${{ matrix.target }} --output dist/${{ matrix.output_binary }}

    # 필수 파일 복사 (Assets)
    - name: Prepare Assets
      shell: bash
      run: |
        mkdir -p dist/config
        
        # 1. 설정/샘플 파일 복사
        cp config/config.txt.sample dist/config/config.txt
        cp config/system_prompt.md.sample dist/config/system_prompt.md
        cp config/shopping_prompt.md.sample dist/config/shopping_prompt.md
        cp topic.json.sample dist/topic.json
        
        # 2. README 처리 (안전하게 수정됨 🛠️)
        if [ -f "README_USER.md" ]; then
            echo "📄 README_USER.md를 발견하여 복사합니다."
            cp README_USER.md dist/README.md
        else
            echo "⚠️ README_USER.md가 없어 기본 내용을 생성합니다."
            # EOF 방식 대신 echo를 사용하여 들여쓰기 에러 방지
            {
              echo "# 🧞‍♂️ BlogGenius 사용자 가이드"
              echo "1. config/config.txt 파일을 열어 설정하세요."
              echo "2. topic.json 파일에 글감을 입력하세요."
              echo "3. 프로그램을 실행하세요."
              echo ""
              echo "[Mac 사용자 주의사항]"
              echo "- M1/M2/M3 사용자: *-mac-arm64 버전을 사용하세요."
              echo "- Intel 사용자: *-mac-intel 버전을 사용하세요."
              echo "- '개발자를 확인할 수 없음' 경고 시: 우클릭 -> 열기"
            } > dist/README.md
        fi
        
        # 3. [Windows 전용] 배치 파일(.bat) 생성
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "@echo off" > dist/실행하기_로그인.bat
          echo "chcp 65001 > nul" >> dist/실행하기_로그인.bat
          echo "BlogGenius.exe login" >> dist/실행하기_로그인.bat
          echo "pause" >> dist/실행하기_로그인.bat

          echo "@echo off" > dist/실행하기_일괄발행.bat
          echo "chcp 65001 > nul" >> dist/실행하기_일괄발행.bat
          echo "BlogGenius.exe batch" >> dist/실행하기_일괄발행.bat
          echo "pause" >> dist/실행하기_일괄발행.bat
          
          echo "@echo off" > dist/실행하기_단건테스트.bat
          echo "chcp 65001 > nul" >> dist/실행하기_단건테스트.bat
          echo "BlogGenius.exe auto" >> dist/실행하기_단건테스트.bat
          echo "pause" >> dist/실행하기_단건테스트.bat
        fi

    - name: Create Platform ZIP
      shell: bash
      env:
        ZIP_NAME: ${{ matrix.zip_name }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import zipfile

        zip_name = os.environ["ZIP_NAME"]
        dist_dir = pathlib.Path("dist")
        if not dist_dir.exists():
            raise SystemExit("dist 폴더가 존재하지 않습니다.")

        with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
            for file_path in sorted(dist_dir.rglob("*")):
                if file_path.is_file():
                    zf.write(file_path, file_path.relative_to(dist_dir))

        print(f"✅ ZIP 생성 완료: {zip_name}")
        PY

    - name: Upload Platform ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.platform_name }}
        path: ${{ matrix.zip_name }}

  bundle:
    name: Assemble Release Folder
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Download All Platform ZIPs
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        merge-multiple: true
        path: release

    - name: Add Top-level README with Versioned Filename
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        README_PATH="release/README_v${VERSION}.md"

        if [ -f "README_USER.md" ]; then
          cp README_USER.md "${README_PATH}"
        elif [ -f "README.md" ]; then
          cp README.md "${README_PATH}"
        else
          {
            echo "# BlogGenius 배포 안내"
            echo ""
            echo "- 각 OS에 맞는 ZIP 파일을 다운로드하여 사용하세요."
            echo "- 실행 전 ZIP 내부의 README.md를 확인하세요."
          } > "${README_PATH}"
        fi

    - name: Verify Release Folder Layout
      shell: bash
      run: |
        ls -la release

    - name: Upload Final Release Folder
      uses: actions/upload-artifact@v4
      with:
        name: BlogGenius-packages-${{ github.ref_name }}
        path: release/
