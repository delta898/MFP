name: Build BlogGenius Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mirror_repo: ${{ steps.check_mirror.outputs.mirror_repo }}
      mirror_repo_pat: ${{ steps.check_mirror.outputs.has_pat }}
    steps:
      - id: check_mirror
        run: |
          echo "mirror_repo=delta898/NaverAutoBlog-Releases" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.MIRROR_REPO_PAT }}" != "" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: setup
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - name: Create or Update Private Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

      - name: Create or Update Mirror Release (Single Job)
        if: env.MIRROR_REPO != '' && env.MIRROR_REPO_PAT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}

  build_and_upload:
    name: Build & Upload ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    needs: [setup, create_release]
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            output_binary: BlogGenius-linux
            platform_name: linux-x64
            zip_name: BlogGenius-linux-x64.zip

          - os: macos-latest
            target: node20-macos-x64
            output_binary: BlogGenius-mac-intel
            platform_name: mac-intel
            zip_name: BlogGenius-mac-intel.zip

          - os: macos-latest
            target: node20-macos-arm64
            output_binary: BlogGenius-mac-arm64
            platform_name: mac-arm64
            zip_name: BlogGenius-mac-arm64.zip

          - os: windows-latest
            target: node20-win-x64
            output_binary: BlogGenius.exe
            platform_name: win-x64
            zip_name: BlogGenius-win-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install yao-pkg
        run: npm install -g @yao-pkg/pkg @yao-pkg/pkg-fetch

      - name: Create secret.js
        shell: bash
        run: |
          mkdir -p src/config
          echo "module.exports = { LICENSE_CHK_URL: '${{ secrets.LICENSE_CHK_URL }}', LICENSE_CHK_KEY: '${{ secrets.LICENSE_CHK_KEY }}' };" > src/config/secret.js

      - name: Build Executable
        run: |
          pkg package.json --targets ${{ matrix.target }} --output dist/${{ matrix.output_binary }}

      - name: Code Sign (Ad-hoc) for macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the binary (required for Apple Silicon to run at all)
          codesign --sign - --force dist/${{ matrix.output_binary }}

      - name: Prepare Assets
        shell: bash
        run: |
          mkdir -p dist/config
          mkdir -p dist/config/images
          mkdir -p dist/scripts

          cp config/config.txt.sample dist/config/config.txt.sample
          if [ -d "config/images" ]; then
              find config/images -maxdepth 1 -type f ! -name '.*' -exec cp {} dist/config/images/ \;
          else
              echo "⚠️ config/images 폴더가 없어 기본 쇼핑 이미지가 누락될 수 있습니다."
          fi
          cp scripts/google_apps_script.js dist/scripts/google_apps_script.js

          if [ -f "README_USER.md" ]; then
              cp README_USER.md dist/README.md
          else
              {
                echo "# BlogGenius 사용자 가이드"
                echo "1. config/config.txt.sample을 복사해 config/config.txt를 만든 뒤 설정하세요."
                echo "2. 프로그램을 실행하세요."
                echo ""
                echo "[Mac 사용자 주의사항]"
                echo "- M1/M2/M3 사용자: *-mac-arm64 버전을 사용하세요."
                echo "- Intel 사용자: *-mac-intel 버전을 사용하세요."
                echo "- '확인할 수 없는 개발자' 경고 시: 앱 우클릭 -> [열기] 선택"
                echo "- 또는 터미널에서 실행: xattr -d com.apple.quarantine BlogGenius-mac-*"
              } > dist/README.md
          fi

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            create_win_bat() {
              local file_name="$1"
              local title="$2"
              local message="$3"
              local command="$4"
              {
                printf '@echo off\r\n'
                printf 'chcp 65001 > nul\r\n'
                printf 'title %s\r\n' "${title}"
                printf 'echo.\r\n'
                printf 'echo [BlogGenius] %s\r\n' "${message}"
                printf 'BlogGenius.exe %s\r\n' "${command}"
                printf 'pause\r\n'
              } > "dist/${file_name}"
            }

            create_win_bat "실행하기_로그인.bat" "BlogGenius Login" "네이버 로그인을 시작합니다..." "login"
            create_win_bat "실행하기_트렌드수집.bat" "BlogGenius Trends Mode" "트렌드 수집(Trends)을 시작합니다..." "trends"
            create_win_bat "실행하기_일괄발행.bat" "BlogGenius Batch Mode" "엑셀 대량 발행(Batch)을 시작합니다..." "batch"
            create_win_bat "실행하기_쇼핑발행.bat" "BlogGenius Shopping Mode" "쇼핑 발행(Shopping)을 시작합니다..." "shopping"
            create_win_bat "실행하기_라이선스상태.bat" "BlogGenius License Status" "라이선스 상태 조회를 시작합니다..." "license status"
            create_win_bat "실행하기_라이선스등록.bat" "BlogGenius License Register" "라이선스 이메일 등록을 시작합니다..." "license register"
            create_win_bat "실행하기_라이선스복구.bat" "BlogGenius License Recover" "라이선스 복구를 시작합니다..." "license recover"
            create_win_bat "실행하기_라이선스업그레이드.bat" "BlogGenius License Upgrade" "라이선스 업그레이드를 시작합니다..." "license upgrade"
          fi

      - name: Create Platform ZIP (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          ZIP_NAME: ${{ matrix.zip_name }}
        run: |
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd -

      - name: Create Platform ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.zip_name }}" -Force

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.zip_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

      - name: Upload ZIP to Mirror Repo
        if: env.MIRROR_REPO != '' && env.MIRROR_REPO_PAT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.zip_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          # Note: We don't set make_latest or generate_release_notes here 
          # to avoid concurrency issues since multiple jobs run in parallel.

  upload_release_readme:
    name: Upload Versioned Release README
    runs-on: ubuntu-latest
    needs: [setup, create_release]
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Create README_v<version>.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          README_OUT="README_v${VERSION}.md"

          if [ -f "README_USER.md" ]; then
            cp README_USER.md "${README_OUT}"
          elif [ -f "README.md" ]; then
            cp README.md "${README_OUT}"
          else
            {
              echo "# BlogGenius 배포 안내"
              echo ""
              echo "- 각 OS에 맞는 ZIP 파일을 다운로드하여 사용하세요."
              echo "- 실행 전 ZIP 내부의 README.md를 확인하세요."
            } > "${README_OUT}"
          fi

          echo "README_FILE=${README_OUT}" >> "$GITHUB_ENV"

      - name: Upload README to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.README_FILE }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload README to Mirror Repo
        if: env.MIRROR_REPO != '' && secrets.MIRROR_REPO_PAT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ secrets.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.README_FILE }}
          fail_on_unmatched_files: true
          overwrite_files: true
