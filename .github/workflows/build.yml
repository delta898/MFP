name: Build BlogGenius Executables

on:
  push:
    tags:
      - 'v*' # v0.1.0 처럼 태그를 달면 자동으로 빌드 시작!

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node18-linux-x64
            output: BlogGenius-linux
          - os: macos-latest
            target: node18-macos-x64
            output: BlogGenius-mac
          - os: windows-latest
            target: node18-win-x64
            output: BlogGenius-win.exe

    steps:
    # 👇 [수정됨] v3 -> v4 로 변경
    - uses: actions/checkout@v4

    # 👇 [수정됨] v3 -> v4 로 변경
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Install pkg
      run: npm install -g pkg

    # ⚠️ Github Secrets에 'LICENSE_CHK_URL', 'LICENSE_CHK_KEY' 등록 필수
    - name: Create secret.js
      shell: bash
      run: |
        mkdir -p src/config
        echo "module.exports = { LICENSE_CHK_URL: '${{ secrets.LICENSE_CHK_URL }}', LICENSE_CHK_KEY: '${{ secrets.LICENSE_CHK_KEY }}' };" > src/config/secret.js

    - name: Build Executable
      run: |
        pkg src/main.js --targets ${{ matrix.target }} --output dist/${{ matrix.output }}

    # 👇 [수정됨] 여기가 문제였습니다! v3 -> v4 로 변경
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlogGenius-${{ matrix.os }}
        path: dist/
