name: Build BlogGenius Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mirror_repo: ${{ steps.check_mirror.outputs.mirror_repo }}
      mirror_repo_pat: ${{ steps.check_mirror.outputs.has_pat }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - id: check_mirror
        run: |
          echo "mirror_repo=delta898/NaverAutoBlog-Releases" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.MIRROR_REPO_PAT }}" != "" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: setup
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - name: Create or Update Private Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-dev') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Mirror Release
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-dev') }}
          make_latest: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-dev') }}

  build_and_upload:
    name: Build & Upload ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    needs: [setup, create_release]
    env:
      MIRROR_REPO: ${{ needs.setup.outputs.mirror_repo }}
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
      APP_VERSION: ${{ needs.setup.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            suffix: linux-x64
            output_binary: BlogGenius-cli
          - os: macos-latest
            target: node20-macos-x64
            suffix: mac-intel
            output_binary: BlogGenius-cli
          - os: macos-latest
            target: node20-macos-arm64
            suffix: mac-arm64
            output_binary: BlogGenius-cli
          - os: windows-latest
            target: node20-win-x64
            suffix: win-x64
            output_binary: BlogGenius-cli.exe

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Install yao-pkg and electron-packager
        run: npm install -g @yao-pkg/pkg @yao-pkg/pkg-fetch electron-packager
      - name: Create secret.js
        shell: bash
        run: |
          mkdir -p src/config
          echo "module.exports = { LICENSE_CHK_URL: '${{ secrets.LICENSE_CHK_URL }}', LICENSE_CHK_KEY: '${{ secrets.LICENSE_CHK_KEY }}' };" > src/config/secret.js

      - name: Build CLI Executable
        run: |
          pkg package.json --targets ${{ matrix.target }} --output dist/${{ matrix.output_binary }}

      - name: Build GUI App
        shell: bash
        run: |
          APP_NAME="BlogGenius"
          if [[ "${{ matrix.suffix }}" == "linux-x64" ]]; then
            E_PLAT="linux"; E_ARCH="x64"
          elif [[ "${{ matrix.suffix }}" == "mac-intel" ]]; then
            E_PLAT="darwin"; E_ARCH="x64"
          elif [[ "${{ matrix.suffix }}" == "mac-arm64" ]]; then
            E_PLAT="darwin"; E_ARCH="arm64"
          elif [[ "${{ matrix.suffix }}" == "win-x64" ]]; then
            E_PLAT="win32"; E_ARCH="x64"
          fi
          electron-packager . ${APP_NAME} --platform=${E_PLAT} --arch=${E_ARCH} --out=dist/gui-temp --overwrite --asar --icon=assets/icons/icon --ignore="(/(\\.git|dist|logs|assets|Videos|workspace|NaverAutoBlog|supabase|temp|docs)(/|$))"

      - name: Code Sign (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --sign - --force dist/${{ matrix.output_binary }}
          APP_PATH=$(find dist/gui-temp -name "BlogGenius.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then codesign --sign - --force --deep "$APP_PATH"; fi

      - name: Finalize Directory Structure (Naming Rule)
        shell: bash
        run: |
          # 1. 로컬 빌드와 동일한 명명 규칙 적용 (BlogGenius-vX.X.X-platform-arch)
          ROOT_NAME="BlogGenius-${APP_VERSION}-${{ matrix.suffix }}"
          ROOT_OUT="dist/${ROOT_NAME}"
          mkdir -p "${ROOT_OUT}/config/images" "${ROOT_OUT}/scripts"

          # 2. 필수 리소스 복사
          cp config/config.txt.sample "${ROOT_OUT}/config/config.txt.sample"
          cp -r config/images/* "${ROOT_OUT}/config/images/" || true
          cp scripts/google_apps_script.js "${ROOT_OUT}/scripts/"
          [ -f "README_USER.md" ] && cp README_USER.md "${ROOT_OUT}/README.md" || echo "# BlogGenius" > "${ROOT_OUT}/README.md"
          
          # 3. CLI 및 GUI 배치
          mv "dist/${{ matrix.output_binary }}" "${ROOT_OUT}/"
          APP_NAME="BlogGenius"
          TEMP_DIR=$(ls dist/gui-temp | head -n 1)
          if [[ "${{ matrix.suffix }}" == "mac-"* ]]; then
            cp -r dist/gui-temp/${TEMP_DIR}/${APP_NAME}.app "${ROOT_OUT}/"
          elif [[ "${{ matrix.suffix }}" == "linux-x64" ]]; then
            mkdir -p "${ROOT_OUT}/lib"
            cp -a dist/gui-temp/${TEMP_DIR}/* "${ROOT_OUT}/lib/"
            mv "${ROOT_OUT}/lib/${APP_NAME}" "${ROOT_OUT}/lib/${APP_NAME}-bin"
            echo -e "#!/bin/bash\nHERE=\"\$(dirname \"\$(readlink -f \"\$0\")\")\"\nexport LD_LIBRARY_PATH=\"\$HERE/lib:\$LD_LIBRARY_PATH\"\n\"\$HERE/lib/${APP_NAME}-bin\" \"\$@\"" > "${ROOT_OUT}/${APP_NAME}"
            chmod +x "${ROOT_OUT}/${APP_NAME}" "${ROOT_OUT}/lib/${APP_NAME}-bin"
          elif [[ "${{ matrix.suffix }}" == "win-x64" ]]; then
            cp -a dist/gui-temp/${TEMP_DIR}/* "${ROOT_OUT}/"
          fi
          
          # 4. ZIP 생성을 위해 원본 dist 정리 (ROOT_OUT만 남김)
          mv "${ROOT_OUT}" "dist-final"
          rm -rf dist/*
          mv "dist-final" "dist/${ROOT_NAME}"
          echo "ZIP_NAME=${ROOT_NAME}.zip" >> $GITHUB_ENV
          echo "ZIP_DIR=${ROOT_NAME}" >> $GITHUB_ENV

      - name: Create ZIP (non-Windows)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: cd dist && zip -r "../${ZIP_NAME}" "${ZIP_DIR}" && cd ..

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "dist\*" -DestinationPath "${env:ZIP_NAME}" -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Mirror
        if: needs.setup.outputs.mirror_repo != '' && needs.setup.outputs.mirror_repo_pat == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          token: ${{ env.MIRROR_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          overwrite_files: true

  upload_readme:
    name: Upload Versioned README
    runs-on: ubuntu-latest
    needs: [setup, create_release]
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          README_OUT="README_v${VERSION}.md"
          [ -f "README_USER.md" ] && cp README_USER.md "${README_OUT}" || echo "# BlogGenius" > "${README_OUT}"
          echo "README_FILE=${README_OUT}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.README_FILE }}

  cleanup_old_releases:
    name: Cleanup Old Releases (-3 Rule)
    runs-on: ubuntu-latest
    needs: [setup, build_and_upload, upload_readme]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIRROR_REPO: delta898/NaverAutoBlog-Releases
      MIRROR_REPO_PAT: ${{ secrets.MIRROR_REPO_PAT }}
    steps:
      - name: Cleanup Private
        run: |
          RELEASES=$(gh release list --limit 100 | tail -n +4 | awk '{print $1}')
          for tag in $RELEASES; do gh release delete "$tag" --yes --cleanup-tag; done
      - name: Cleanup Mirror
        if: needs.setup.outputs.mirror_repo_pat == 'true'
        run: |
          export GITHUB_TOKEN=${{ secrets.MIRROR_REPO_PAT }}
          RELEASES=$(gh release list -R ${{ env.MIRROR_REPO }} --limit 100 | tail -n +4 | awk '{print $1}')
          for tag in $RELEASES; do gh release delete "$tag" -R ${{ env.MIRROR_REPO }} --yes --cleanup-tag; done
