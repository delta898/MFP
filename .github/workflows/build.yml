name: Build BlogGenius Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 1. 리눅스
          - os: ubuntu-latest
            target: node18-linux-x64
            output_binary: BlogGenius-linux
            platform_name: linux-x64
            
          # 2. 맥 (Intel)
          - os: macos-latest
            target: node18-macos-x64
            output_binary: BlogGenius-mac-intel
            platform_name: mac-intel
            
          # 3. 맥 (Apple Silicon - M1/M2/M3)
          - os: macos-latest
            target: node18-macos-arm64
            output_binary: BlogGenius-mac-arm64
            platform_name: mac-arm64

          # 4. 윈도우
          - os: windows-latest
            target: node18-win-x64
            output_binary: BlogGenius.exe
            platform_name: win-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Install pkg
      run: npm install -g pkg

    - name: Create secret.js
      shell: bash
      run: |
        mkdir -p src/config
        echo "module.exports = { LICENSE_CHK_URL: '${{ secrets.LICENSE_CHK_URL }}', LICENSE_CHK_KEY: '${{ secrets.LICENSE_CHK_KEY }}' };" > src/config/secret.js

    # 바이너리 빌드
    - name: Build Executable
      run: |
        pkg src/main.js --targets ${{ matrix.target }} --output dist/${{ matrix.output_binary }}

    # 필수 파일 복사 (Assets)
    - name: Prepare Assets
      shell: bash
      run: |
        mkdir -p dist/config
        
        # 1. 설정/샘플 파일 복사
        cp config/settings.js.sample dist/config/settings.js
        cp config/system_prompt.md.sample dist/config/system_prompt.md
        cp jobs.xlsx.sample dist/jobs.xlsx
        cp job.json.sample dist/job.json
        
        # 2. README 처리 (안전하게 수정됨 🛠️)
        if [ -f "README_USER.md" ]; then
            echo "📄 README_USER.md를 발견하여 복사합니다."
            cp README_USER.md dist/README.md
        else
            echo "⚠️ README_USER.md가 없어 기본 내용을 생성합니다."
            # EOF 방식 대신 echo를 사용하여 들여쓰기 에러 방지
            {
              echo "# 🧞‍♂️ BlogGenius 사용자 가이드"
              echo "1. config/settings.js 파일을 메모장으로 열어 설정하세요."
              echo "2. jobs.xlsx 파일에 글감을 입력하세요."
              echo "3. 프로그램을 실행하세요."
              echo ""
              echo "[Mac 사용자 주의사항]"
              echo "- M1/M2/M3 사용자: *-mac-arm64 버전을 사용하세요."
              echo "- Intel 사용자: *-mac-intel 버전을 사용하세요."
              echo "- '개발자를 확인할 수 없음' 경고 시: 우클릭 -> 열기"
            } > dist/README.md
        fi
        
        # 3. [Windows 전용] 배치 파일(.bat) 생성
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "@echo off" > dist/실행하기_로그인.bat
          echo "chcp 65001 > nul" >> dist/실행하기_로그인.bat
          echo "BlogGenius.exe login" >> dist/실행하기_로그인.bat
          echo "pause" >> dist/실행하기_로그인.bat

          echo "@echo off" > dist/실행하기_일괄발행.bat
          echo "chcp 65001 > nul" >> dist/실행하기_일괄발행.bat
          echo "BlogGenius.exe batch" >> dist/실행하기_일괄발행.bat
          echo "pause" >> dist/실행하기_일괄발행.bat
          
          echo "@echo off" > dist/실행하기_단건테스트.bat
          echo "chcp 65001 > nul" >> dist/실행하기_단건테스트.bat
          echo "BlogGenius.exe auto" >> dist/실행하기_단건테스트.bat
          echo "pause" >> dist/실행하기_단건테스트.bat
        fi

    # 압축파일 이름에 버전(github.ref_name) 넣기
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        # 예: BlogGenius-v0.1.7-mac-arm64
        name: BlogGenius-${{ github.ref_name }}-${{ matrix.platform_name }}
        path: dist/
