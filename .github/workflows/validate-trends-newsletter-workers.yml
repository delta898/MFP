name: Validate Trends Newsletter Workers

on:
  pull_request:
    branches:
      - dev
      - feature/naver-trends-mailing-list
    paths:
      - 'apps/trends/trends-api/workers/**'
      - 'apps/trends/trends-newsletter/**'
      - '.github/workflows/validate-trends-newsletter-workers.yml'
  push:
    branches:
      - 'codex/**'
      - 'feature/**'
    paths:
      - 'apps/trends/trends-api/workers/**'
      - 'apps/trends/trends-newsletter/**'
      - '.github/workflows/validate-trends-newsletter-workers.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Newsletter Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/trends/trends-api/workers/package-lock.json
            apps/trends/trends-newsletter/worker/package-lock.json

      - name: Validate newsletter Workflow Worker
        working-directory: apps/trends/trends-newsletter/worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run

      - name: Validate Trends API Worker
        working-directory: apps/trends/trends-api/workers
        run: |
          npm ci
          npm test
          npx wrangler deploy --env='' --dry-run
