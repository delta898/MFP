name: Deploy Trends Newsletter Development

on:
  pull_request:
    branches:
      - dev
      - feature/naver-trends-mailing-list
    paths:
      - 'apps/trends/trends-api/workers/**'
      - 'apps/trends/trends-newsletter/**'
      - '.github/workflows/deploy-trends-newsletter-development.yml'
  push:
    branches:
      - dev
      - 'codex/**'
    paths:
      - 'apps/trends/trends-api/workers/**'
      - 'apps/trends/trends-newsletter/**'
      - '.github/workflows/deploy-trends-newsletter-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trends-newsletter-development
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Newsletter Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/trends/trends-api/workers/package-lock.json
            apps/trends/trends-newsletter/worker/package-lock.json

      - name: Validate newsletter Workflow Worker
        working-directory: apps/trends/trends-newsletter/worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run

      - name: Validate Trends API Worker
        working-directory: apps/trends/trends-api/workers
        run: |
          npm ci
          npm test
          npx wrangler deploy --env='' --dry-run

  deploy-development:
    name: Deploy Development Workers
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/trends/trends-api/workers/package-lock.json
            apps/trends/trends-newsletter/worker/package-lock.json

      - name: Deploy newsletter Workflow Worker
        working-directory: apps/trends/trends-newsletter/worker
        run: |
          npm ci
          npx wrangler deploy

      - name: Deploy Development Trends API Worker
        working-directory: apps/trends/trends-api/workers
        run: |
          npm ci
          npm run deploy:development
