<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">BlogGenius 사이트 설정 화면 목업</title>
  <desc id="description">프로젝트는 사용자에게 보이지 않으며, 사이트 이름과 hostname/domain을 설정하는 제안 화면.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#211914"/><stop offset="1" stop-color="#17120f"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .muted { fill: #b6a697; }
      .text { fill: #f0e5d8; }
      .caption { fill: #a99584; font-size: 15px; }
      .outline { fill: #2d231d; stroke: #554237; stroke-width: 1.5; }
      .button { fill: #30251f; stroke: #604a3b; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1000" rx="22" fill="url(#page)"/>
  <rect x="0" y="0" width="290" height="1000" rx="22" fill="#2c221c"/>
  <path d="M289 0v1000" stroke="#514034" stroke-width="2"/>
  <text x="38" y="62" class="text" font-size="31" font-weight="700">BlogGenius</text>
  <text x="44" y="125" class="muted" font-size="15">홈</text>
  <text x="84" y="166" class="muted" font-size="21">▦　대시보드</text>
  <path d="M32 205h226" stroke="#514034"/>
  <text x="44" y="244" class="muted" font-size="15">웹사이트</text>
  <rect x="24" y="263" width="242" height="56" rx="10" fill="#cc7842"/>
  <text x="54" y="299" fill="#251812" font-size="20" font-weight="700">▣　사이트</text>
  <path d="M32 345h226" stroke="#514034"/>
  <text x="44" y="384" class="muted" font-size="15">콘텐츠</text>
  <text x="54" y="429" class="muted" font-size="20">☷　블로그</text>
  <text x="54" y="478" class="muted" font-size="20">▧　카드뉴스</text>
  <text x="54" y="527" class="muted" font-size="20">▢　쇼핑커넥트</text>
  <text x="54" y="576" class="muted" font-size="20">♧　SNS</text>
  <path d="M32 612h226" stroke="#514034"/>
  <text x="44" y="651" class="muted" font-size="15">계정</text>
  <text x="54" y="696" class="muted" font-size="20">♙　내 정보</text>
  <path d="M32 732h226" stroke="#514034"/>
  <text x="44" y="771" class="muted" font-size="15">시스템</text>
  <text x="54" y="816" class="muted" font-size="20">◴　설정</text>

  <text x="334" y="88" class="text" font-size="38" font-weight="700">사이트</text>
  <text x="334" y="126" class="muted" font-size="19">웹사이트를 만들고 관리합니다.</text>

  <text x="334" y="210" fill="#d28a56" font-size="15">‹ 내 사이트</text>
  <text x="334" y="260" class="text" font-size="29" font-weight="700">나의 첫 사이트</text>
  <text x="334" y="291" class="muted" font-size="16">사이트 설정</text>

  <rect x="334" y="326" width="900" height="450" rx="12" class="outline"/>
  <text x="366" y="371" class="text" font-size="21" font-weight="700">기본 정보</text>
  <text x="366" y="423" class="text" font-size="15" font-weight="600">사이트 이름</text>
  <rect x="366" y="440" width="836" height="52" rx="7" fill="#211914" stroke="#70543f" stroke-width="1.5"/>
  <text x="384" y="473" class="text" font-size="16">나의 첫 사이트</text>
  <text x="366" y="523" class="caption">목록에서 사이트를 구분할 때 사용하는 이름입니다.</text>
  <path d="M366 518h836" stroke="#514034"/>
  <text x="366" y="556" class="text" font-size="15" font-weight="600">사용자 도메인</text>
  <text x="366" y="592" class="caption">호스트 이름</text>
  <rect x="366" y="605" width="300" height="48" rx="7" fill="#211914" stroke="#70543f" stroke-width="1.5"/>
  <text x="384" y="635" class="muted" font-size="15">blog</text>
  <text x="683" y="636" class="text" font-size="20">.</text>
  <text x="704" y="592" class="caption">도메인</text>
  <rect x="704" y="605" width="498" height="48" rx="7" fill="#211914" stroke="#70543f" stroke-width="1.5"/>
  <text x="722" y="635" class="muted" font-size="15">example.com</text>
  <text x="366" y="690" class="caption">주소 미리보기: <tspan class="text">blog.example.com</tspan></text>
  <text x="366" y="719" class="caption">현재는 도메인 정보만 저장하며 배포 주소는 workers.dev를 사용합니다.</text>
  <path d="M366 740h836" stroke="#514034"/>
  <rect x="1034" y="752" width="78" height="40" rx="8" class="button"/>
  <text x="1054" y="778" class="text" font-size="14">취소</text>
  <rect x="1120" y="752" width="82" height="40" rx="8" fill="#d27c43"/>
  <text x="1144" y="778" fill="#21150f" font-size="14" font-weight="700">저장</text>

  <text x="334" y="679" class="caption">사이트 목록의 카드에서 `설정`을 선택해 진입하는 안</text>
  <text x="334" y="815" class="caption">Project와 기본 Project는 화면에 노출하지 않습니다.</text>
  <text x="334" y="841" class="caption">전체 custom domain은 선택적 hostname + domain으로 계산합니다.</text>

  <path d="M334 916h1222" stroke="#514034" stroke-width="1.5"/>
  <text x="339" y="953" class="text" font-size="16" font-weight="700">BlogGenius</text>
  <text x="1071" y="953" class="muted" font-size="15">©도전인생 All rights reserved</text>
</svg>
