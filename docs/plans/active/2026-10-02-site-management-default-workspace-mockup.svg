  <text x="1262" y="442" fill="#21150f" font-size="15" font-weight="700">배포</text>

  <rect x="334" y="526" width="1222" height="143" rx="12" class="outline"/>
  <text x="362" y="569" class="text" font-size="20" font-weight="700">제품 소개</text>
  <text x="362" y="600" class="muted" font-size="16">간단한 홈페이지 · 로컬에 준비됨</text>
  <rect x="362" y="621" width="66" height="27" rx="14" fill="#334033"/>
  <text x="376" y="640" fill="#a4c28e" font-size="13">배포됨</text>
  <rect x="990" y="575" width="111" height="44" rx="8" class="outline"/>
  <text x="1017" y="603" class="text" font-size="15">미리보기</text>
  <rect x="1110" y="575" width="111" height="44" rx="8" class="outline"/>
  <text x="1137" y="603" class="text" font-size="15">폴더 열기</text>
  <rect x="1230" y="575" width="104" height="44" rx="8" fill="#d27c43"/>
  <text x="1262" y="603" fill="#21150f" font-size="15" font-weight="700">배포</text>

  <text x="334" y="711" class="caption">미리보기는 전체 빌드 후 열립니다.</text>
  <path d="M334 916h1222" stroke="#514034" stroke-width="1.5"/>
  <text x="339" y="953" class="text" font-size="16" font-weight="700">BlogGenius</text>
  <text x="1071" y="953" class="muted" font-size="15">©도전인생 All rights reserved</text>
