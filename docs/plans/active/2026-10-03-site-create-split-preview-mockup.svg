    <linearGradient id="page-preview" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ed"/><stop offset="1" stop-color="#e9e7df"/></linearGradient>
    <linearGradient id="studio-preview" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f0e8"/><stop offset="1" stop-color="#e8ddd0"/></linearGradient>
