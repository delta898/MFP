<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">사이트 만들기 화면: 압축된 템플릿 목록과 로고 상태</title>
  <desc id="desc">왼쪽은 3열 템플릿 카드와 설정, 오른쪽은 사이트 미리보기와 템플릿 정보다. 메뉴 추가는 메뉴 표 머리글 오른쪽, 미리보기는 왼쪽 패널 하단 오른쪽에 둔다.</desc>
