      <section class="view social-view" id="view-social">
        <div class="view-title-block">
          <div class="view-title-row">
            <div class="view-title-copy">
              <div class="view-title-heading"><h1>SNS</h1></div>
              <p>짧은 생각과 기록을 설정된 Buffer 채널에 바로 발행합니다.</p>
            </div>
            <div class="page-clock-widget">
              <div class="clock-display" data-clock-display title="클릭하여 시계 스타일 변경"></div>
            </div>
          </div>
        </div>

        <div class="social-tabs ui-top-tabs" role="tablist" aria-label="SNS 메뉴">
          <button class="social-tab-btn ui-top-tab active" id="social-tab-button-compose" type="button" role="tab"
            aria-selected="true" aria-controls="social-tab-compose" tabindex="0">직접 작성</button>
        </div>

        <div class="card social-composer-card" id="social-tab-compose" role="tabpanel"
          aria-labelledby="social-tab-button-compose">
          <div class="social-composer-intro blog-next-panel-lead blog-next-panel-intro">
            <div class="blog-next-panel-intro-copy">
              <h2>SNS 게시물 작성</h2>
              <p>메시지와 이미지를 준비한 뒤 발행 대상을 선택해 발행하세요.</p>
            </div>
          </div>
          <section class="social-composer-section" aria-labelledby="manual-sns-text-title">
            <div class="social-section-heading social-editor-heading">
              <div>
                <h2 id="manual-sns-text-title">내용</h2>
                <p>발행할 글을 입력하세요. 채널별 글자 수 제한을 넘으면 발행되지 않습니다.</p>
              </div>
              <div class="social-editor-tools">
                <span id="manual-sns-ai-action" class="social-ai-action" hidden>
                  <button id="manual-sns-ai-optimize-btn" class="secondary compact" type="button">AI 최적화</button>
                  <span class="social-ai-tooltip">공통 Chat Model로 오탈자, 가독성, 검색 키워드와 해시태그를 다듬습니다. 선택 채널의 가장 짧은 글자 수에 맞추며, 공급자 정책에 따라 비용이 발생할 수 있습니다.</span>
                </span>
                <button id="manual-sns-ai-undo-btn" class="text-btn" type="button" hidden>최적화 전으로 되돌리기</button>
              </div>
            </div>
            <div class="social-editor-shell">
              <textarea id="manual-sns-text" class="social-editor" rows="6"
                placeholder="오늘의 생각이나 기록을 자유롭게 작성해 보세요."></textarea>
              <span id="manual-sns-character-count" class="social-character-count">0자</span>
            </div>
            <div id="manual-sns-ai-status" class="social-ai-status" aria-live="polite"></div>
            <div id="manual-sns-limit-status" class="social-limit-status" aria-live="polite"></div>
          </section>

          <section class="social-composer-section" aria-labelledby="manual-sns-image-title">
            <div class="social-section-heading">
              <div>
                <h2 id="manual-sns-image-title">이미지 <span class="social-optional-label">선택</span></h2>
              </div>
            </div>
            <div id="manual-sns-image-local-panel" class="social-local-image-panel">
              <input id="manual-sns-image-file" class="social-local-image-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif">
              <div id="manual-sns-image-grid" class="social-local-image-grid" aria-live="polite"></div>
            </div>
            <div id="manual-sns-image-generation-status" class="social-ai-status" aria-live="polite"></div>
          </section>

          <section class="social-composer-section" aria-labelledby="manual-sns-channels-title">
            <label class="ui-settings-field social-workspace-select buffer-publishing-workspace" for="manual-sns-organization">
              <span>작업 공간</span>
              <span class="ui-field-action"><span class="ui-select-shell"><select id="manual-sns-organization" disabled><option value="">작업 공간을 불러와 선택해 주세요.</option></select></span><button id="manual-sns-workspaces-load" class="secondary" type="button" disabled>작업 공간 불러오기</button></span>
              <small>선택한 작업 공간의 SNS 채널을 불러옵니다.</small>
            </label>
            <div class="social-section-heading buffer-publishing-channel-heading">
              <div class="social-channel-heading-copy buffer-publishing-channel-heading-copy">
                <div class="social-channel-title-row buffer-publishing-channel-title-row">
                  <input id="manual-sns-select-all" type="checkbox" disabled>
                  <label id="manual-sns-channels-title" for="manual-sns-select-all">발행 채널 <small id="manual-sns-channel-limit">최대 3개 · 0개 선택</small></label>
                </div>
                <p>이번 발행에 사용할 채널을 선택하세요.</p>
              </div>
              <button class="context-help-link" type="button" data-help-guide-url="https://m.blog.naver.com/amadejjs/223940980574">Buffer 도움말</button>
            </div>
            <div id="manual-sns-channel-list" class="social-channel-grid ui-selectable-card-grid" aria-live="polite"></div>
          </section>

          <div class="social-composer-actions">
            <div id="manual-sns-publish-summary" class="social-publish-summary">발행할 채널을 선택하세요.</div>
            <button id="manual-sns-publish-btn" class="primary ui-loading-action" type="button" disabled>지금 발행</button>
          </div>
          <div id="manual-sns-publish-result" class="social-publish-result" aria-live="polite"></div>
        </div>
      </section>
