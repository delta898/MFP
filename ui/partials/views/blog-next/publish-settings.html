<details class="blog-next-disclosure blog-next-draft-settings" id="blog-next-publish-settings" data-blog-next-publish-settings data-blog-next-draft-settings="ai">
  <summary>
    <strong id="blog-next-publish-settings-title">발행 설정</strong>
    <span id="blog-next-publish-settings-summary" data-blog-next-draft-settings-summary="ai">네이버 블로그 · 즉시 발행 · 보이지 않게 실행</span>
  </summary>
  <div class="blog-next-disclosure-grid blog-next-form-grid blog-next-draft-options" data-blog-next-draft-options="ai">
    <fieldset class="blog-next-field blog-next-field-wide blog-next-targets blog-next-draft-targets">
      <legend>
        포스팅 대상
        <span class="tooltip-container blog-next-help-trigger" tabindex="0" aria-label="포스팅 대상 도움말" aria-describedby="blog-next-help-publish-targets">
          <span class="tooltip-icon">?</span>
          <span class="tooltip-text" id="blog-next-help-publish-targets" role="tooltip">현재 원고를 올릴 블로그나 내 사이트를 선택합니다.</span>
        </span>
      </legend>
      <label><input id="blog-next-target-naver" name="blog-next-publish-target" data-draft-field="target-naver" type="radio" value="naver" checked> 네이버 블로그</label>
      <label><input id="blog-next-target-wordpress" name="blog-next-publish-target" data-draft-field="target-wordpress" type="radio" value="wordpress"> 워드프레스</label>
      <label id="blog-next-target-site-hosting-option" data-blog-next-site-target>
        <input id="blog-next-target-site-hosting" name="blog-next-publish-target" data-draft-field="target-site-hosting" type="radio" value="site-hosting" aria-label="사이트" disabled>
        사이트
      </label>
      <span class="ui-select-shell blog-next-site-hosting-inline" id="blog-next-site-hosting-field" aria-label="발행할 사이트">
        <select id="blog-next-site-hosting-select" aria-label="발행할 사이트" aria-describedby="blog-next-site-hosting-message" disabled>
          <option value="" selected>사이트를 선택하세요</option>
        </select>
      </span>
      <button class="ui-refresh-action-icon blog-next-site-hosting-refresh" id="blog-next-site-hosting-retry" type="button" aria-label="사이트 목록 새로고침" title="사이트 목록 새로고침" aria-busy="false" disabled>
        <svg aria-hidden="true"><use href="#ui-icon-refresh"></use></svg>
      </button>
    </fieldset>
    <small class="blog-next-site-hosting-status" id="blog-next-site-hosting-message" role="status" aria-live="polite"></small>
    <div class="blog-next-field blog-next-category-field" id="blog-next-category-field">
      <label id="blog-next-category-label" for="blog-next-category">카테고리 <small>(선택)</small></label>
      <input id="blog-next-category" type="text" placeholder="비우면 기본 카테고리">
      <div class="blog-next-vault-folder-control" id="blog-next-vault-folder-control" hidden>
        <div class="blog-next-folder-selection" id="blog-next-vault-folder-value" data-empty="true" aria-live="polite">
          <span>폴더를 선택하세요</span>
        </div>
        <select id="blog-next-vault-folder-select" aria-label="Vault 저장 폴더" aria-describedby="blog-next-site-category-hint" aria-hidden="true" hidden disabled>
          <option value="">폴더를 선택하세요</option>
        </select>
        <button class="secondary blog-next-folder-select" id="blog-next-vault-folder-choose" type="button"
          aria-label="Vault 저장 폴더 선택" aria-busy="false" disabled>폴더 선택</button>
      </div>
      <small class="blog-next-site-category-hint" id="blog-next-site-category-hint" role="status" aria-live="polite" hidden></small>
    </div>
    <div class="blog-next-legacy-category-values" hidden aria-hidden="true">
      <input id="blog-next-naver-category" data-draft-field="naver-category" type="text" tabindex="-1">
      <input id="blog-next-wordpress-category" data-draft-field="wordpress-category" type="text" tabindex="-1">
    </div>
    <label class="blog-next-field">
      <span class="blog-next-field-label-with-help">
        포스팅 옵션
        <span class="tooltip-container blog-next-help-trigger" tabindex="0" aria-label="포스팅 옵션 도움말" aria-describedby="blog-next-help-post-status">
          <span class="tooltip-icon">?</span>
          <span class="tooltip-text" id="blog-next-help-post-status" role="tooltip">즉시 발행은 바로 공개하고, 임시 저장은 대상 서비스 정책에 따라 비공개로 보관합니다. 내 사이트는 글을 로컬에만 저장하고 배포하지 않습니다. 예약 발행은 지정한 공개 일시에 등록하며 내 사이트에서는 지원하지 않습니다. 공개·예약 발행 전에는 이미지 확인에서 빈 이미지를 먼저 처리해야 합니다. 미완성 이미지가 있으면 임시저장만 가능합니다.</span>
        </span>
      </span>
      <span class="ui-select-shell"><select id="blog-next-post-status" data-draft-field="post-status" aria-describedby="blog-next-publish-safety-hint">
        <option value="publish">즉시 발행</option>
        <option value="draft">임시 저장</option>
        <option value="schedule">예약 발행</option>
      </select></span>
      <small class="blog-next-image-safety-hint" id="blog-next-publish-safety-hint" data-draft-image-safety-hint hidden>
        <span id="blog-next-publish-safety-message"></span>
        <button class="ui-text-action blog-next-image-safety-action" id="blog-next-publish-image-action" type="button"
          aria-controls="blog-next-ai-draft-images" hidden>이미지 처리하기 ↑</button>
      </small>
    </label>
    <label class="blog-next-field blog-next-dependent-field" id="blog-next-schedule-field" data-draft-schedule-field data-dependency-active="false">
      <span>예약 일시 <small id="blog-next-schedule-required" data-draft-schedule-required hidden>(필수)</small></span>
      <span class="visually-hidden" id="blog-next-schedule-hint">예약 발행을 선택하면 활성화됩니다.</span>
      <input id="blog-next-schedule-date" data-draft-field="schedule-date" type="datetime-local" aria-describedby="blog-next-schedule-hint" disabled>
    </label>
    <div class="blog-next-dependent-field blog-next-draft-headless" id="blog-next-headless-field" data-draft-provider-field="naver" data-dependency-active="true">
      <div class="blog-next-headless-control">
        <label class="blog-next-check-label blog-next-headless-option">
          <input id="blog-next-runner-headless" data-draft-field="headless" type="checkbox" checked> 보이지 않게 실행
        </label>
        <span class="tooltip-container blog-next-help-trigger" tabindex="0" aria-label="보이지 않게 실행 도움말" aria-describedby="blog-next-help-headless">
          <span class="tooltip-icon">?</span>
          <span class="tooltip-text" id="blog-next-help-headless" role="tooltip">네이버 포스팅 브라우저를 화면에 표시하지 않고 실행합니다. 워드프레스에는 적용되지 않습니다.</span>
        </span>
      </div>
    </div>
  </div>
</details>
