        <section class="card form-card blog-next-panel" id="blog-next-panel-automation" role="tabpanel"
          aria-labelledby="blog-next-tab-automation" hidden>
          <div class="blog-next-panel-lead blog-next-panel-intro">
            <div class="blog-next-panel-intro-copy">
              <h2>준비된 글을 원하는 시간에 이어서 발행</h2>
              <p>사용 여부와 발행 시간대를 정하면 대기열의 글을 순서대로 처리합니다.</p>
            </div>
          </div>
          <form id="blog-next-automation-form" class="blog-next-automation-form">
            <div class="blog-next-automation-toggle">
              <label>
                <input id="blog-next-automation-enabled" type="checkbox">
                <strong>연속 발행 사용</strong>
              </label>
            </div>
            <div class="blog-next-automation-fields blog-next-dependent-field" data-dependency-active="false">
              <label class="blog-next-field"><span>발행 허용 시작</span><input id="blog-next-automation-start-time" type="time" value="00:00" required disabled></label>
              <label class="blog-next-field"><span>발행 허용 종료</span><input id="blog-next-automation-end-time" type="time" value="23:59" required disabled></label>
              <label class="blog-next-field"><span>발행 간격</span><span class="blog-next-number-field"><input id="blog-next-automation-interval" type="number" min="10" max="360" step="1" value="60" required disabled><em>분</em></span></label>
              <label class="blog-next-automation-notify"><input id="blog-next-automation-notify" type="checkbox" disabled><span>완료·실패 알림 사용</span></label>
            </div>
            <div class="blog-next-automation-actions">
              <button class="secondary" id="blog-next-automation-test" type="button" hidden>30초 테스트</button>
              <button class="primary" id="blog-next-automation-save" type="submit" disabled>설정 저장</button>
            </div>
            <p class="blog-next-automation-feedback" id="blog-next-automation-feedback" data-state="idle" role="status" aria-live="polite" hidden></p>
            <p class="blog-next-automation-summary" id="blog-next-automation-status" role="status" aria-live="polite" hidden></p>
          </form>
        </section>
