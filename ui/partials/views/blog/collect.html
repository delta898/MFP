        <div class="card form-card blog-tab-panel" id="blog-tab-collect">
          <div class="auto-section">
            <div class="auto-mode-inline">
              <label class="settings-checkbox-label settings-checkbox-inline">
                <input id="blog-collect-trends-enabled" type="checkbox">
                <span class="auto-mode-title">트렌드 자동 수집 사용</span>
              </label>
            </div>
            <div class="form-grid" style="align-items: stretch;">
              <div class="form-field-block" style="display: flex; flex-direction: column;">
                <span class="field-label-text">수집 카테고리</span>
                <div class="category-picker" style="flex: 1; display: flex; flex-direction: column;">
                  <div id="blog-collect-trends-category-options" class="category-options" data-blog-category-options
                    style="flex: 1; max-height: 280px; min-height: 220px;">
                    <p class="category-hint">카테고리 목록을 불러오는 중...</p>
                  </div>
                </div>
              </div>
              <div class="form-field-block" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-field-block"
                  style="margin-bottom: 0; padding: 0; border: none; background: transparent;">
                  <span class="label-title-row">
                    <span class="field-label-text">필터 조건</span>
                    <button type="button" class="label-help" data-help="아무것도 선택하지 않으면 증감 전체를 허용합니다."
                      aria-label="필터 조건 도움말">?</button>
                  </span>
                  <div class="auto-variation-filter">
                    <label class="settings-checkbox-label compact">
                      <input id="blog-collect-trends-filter-new" type="checkbox">
                      <span>new 포함</span>
                    </label>
                    <label class="settings-checkbox-label compact">
                      <input id="blog-collect-trends-filter-dash" type="checkbox">
                      <span>- 포함</span>
                    </label>
                    <label class="settings-checkbox-label compact">
                      <input id="blog-collect-trends-filter-number-enabled" type="checkbox" checked>
                      <select id="blog-collect-trends-filter-type"
                        style="padding:2px 4px; font-size:13px; border-radius:4px; border:1px solid var(--border-color); background:var(--surface-color); color:var(--text-primary);">
                        <option value="min">증가값 (Min)</option>
                        <option value="top">증가 순위 (Top N)</option>
                      </select>
                    </label>
                    <div class="auto-variation-number-input" id="blog-collect-trends-filter-min-wrap">
                      <input id="blog-collect-trends-filter-min" type="number" step="1" value="50"
                        placeholder="증가값 (예: 50)">
                    </div>
                    <div class="auto-variation-number-input" id="blog-collect-trends-filter-top-wrap"
                      style="display:none;">
                      <input id="blog-collect-trends-filter-top" type="number" step="1" value="5" min="1"
                        placeholder="순위 (예: 5)">
                    </div>
                  </div>
                </div>

                <div style="display: flex; gap: 15px; width: 100%;">
                  <div class="form-field-block"
                    style="margin-bottom: 0; padding: 0; border: none; background: transparent; flex: 1;">
                    <span class="label-title-row">
                      <span class="field-label-text">중복 금지 간격(일)</span>
                      <button type="button" class="label-help" data-help="설정한 기간 내 같은 키워드는 수집에서 제외됩니다. (0=제한 없음)"
                        aria-label="중복 키워드 금지 간격 도움말">?</button>
                    </span>
                    <input id="blog-collect-trends-reuse-gap" type="number" min="0" step="1" value="15"
                      placeholder="예: 15" style="width: 100%;">
                  </div>

                  <div class="form-field-block"
                    style="margin-bottom: 0; padding: 0; border: none; background: transparent; flex: 1;">
                    <span class="field-label-text">수집 스케줄 (매일)</span>
                    <input id="blog-collect-trends-time" type="time" style="width: 100%;">
                  </div>
                </div>

                <div style="display: flex; gap: 15px; width: 100%;">
                  <div class="form-field-block"
                    style="margin-bottom: 0; padding: 0; border: none; background: transparent; flex: 1; display: flex; flex-direction: column; gap: 6px;">
                    <span class="label-title-row" style="margin-bottom: 0;">
                      <span class="field-label-text">Naver Category</span>
                      <button type="button" class="label-help" data-help="자동 수집된 트렌드 글감의 네이버 기본 카테고리를 지정합니다."
                        aria-label="Naver Category 도움말">?</button>
                    </span>
                    <input type="text" id="blog-collect-trends-naver-category" placeholder="네이버 카테고리 (예: 도전인생)"
                      style="width: 100%;">
                  </div>

                  <div class="form-field-block"
                    style="margin-bottom: 0; padding: 0; border: none; background: transparent; flex: 1; display: flex; flex-direction: column; gap: 6px;">
                    <span class="label-title-row" style="margin-bottom: 0;">
                      <span class="field-label-text">WordPress Category</span>
                      <button type="button" class="label-help" data-help="자동 수집된 트렌드 글감의 워드프레스 기본 카테고리를 지정합니다."
                        aria-label="WordPress Category 도움말">?</button>
                    </span>
                    <input type="text" id="blog-collect-trends-wordpress-category" placeholder="워드프레스 카테고리 (예: IT/Tech)"
                      style="width: 100%;">
                  </div>
                </div>
              </div>
            </div>

            <div class="auto-manual-row"
              style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
              <div class="auto-manual-inline" style="display: flex; gap: 8px; align-items: center;">
                <span class="field-label-text" style="color: var(--text-color); font-weight: 500;">수동 실행</span>
                <input id="blog-collect-trends-date" type="date" title="특정일 지정 수집" style="max-width: 140px;">
              </div>
              <button id="blog-collect-trends-run-btn" class="secondary" type="button">트렌드 수동 수집</button>
            </div>
          </div>

          <div class="auto-section">
            <div class="auto-mode-inline" style="margin-bottom: 6px;">
              <label class="settings-checkbox-label" style="font-weight: 600; color: var(--primary-color);">
                <input id="blog-collect-rss-enabled" type="checkbox" onchange="syncRssRunner()">
                <span class="auto-mode-title">RSS 수집 사용</span>
              </label>
            </div>
            <div class="rss-table-wrapper"
              style="overflow-x: auto; margin-top: 6px; border: 1px solid var(--border-color); border-radius: 4px;">
              <table class="rss-config-table" style="width: 100%; border-collapse: collapse; min-width: 800px;">
                <thead style="background-color: var(--secondary-bg); border-bottom: 1px solid var(--border-color);">
                  <tr>
                    <th style="padding: 10px; text-align: center; width: 40px;">
                      <input id="blog-collect-rss-toggle-all" type="checkbox" title="모두 선택/해제"
                        onchange="toggleAllRssConfigs(this.checked)">
                    </th>
                    <th style="padding: 10px; text-align: left; width: 250px;">RSS URL</th>
                    <th style="padding: 10px; text-align: left; width: 140px;">Category (N/W)</th>
                    <th style="padding: 10px; text-align: center; width: 80px;">주기(분)</th>
                    <th style="padding: 10px; text-align: left; width: 150px;">포함 키워드</th>
                    <th style="padding: 10px; text-align: left; width: 150px;">제외 키워드</th>
                    <th style="padding: 10px; text-align: center; width: 140px;">액션</th>
                  </tr>
                </thead>
                <tbody id="blog-collect-rss-tbody">
                  <!-- RSS 항목들이 자바스크립트에 의해 추가됩니다 -->
                </tbody>
              </table>
            </div>

            <button id="blog-collect-rss-add-btn" class="secondary compact" style="margin-top: 12px;" type="button">+
              RSS 피드 추가</button>

            <div class="auto-manual-row"
              style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
              <div class="auto-manual-inline">
                <span class="field-label-text">수동 실행</span>
              </div>
              <button id="blog-collect-rss-run-btn" class="secondary" type="button">RSS 수동 수집</button>
            </div>
          </div>


          <div class="auto-section auto-log-section">
            <h3 class="auto-section-title">로그</h3>
            <pre id="blog-collect-trends-result" class="settings-major-result"></pre>
          </div>
        </div>
