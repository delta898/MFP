      <section class="view" id="view-logs" data-style-scope="compatibility">
        <div class="view-title-block logs-header">
          <div class="view-title-row">
            <div class="view-title-copy">
              <div class="view-title-heading"><h1>로그 및 이력</h1></div>
              <p>최근 활동 이력과 시스템 로그를 확인합니다.</p>
            </div>
            <div class="page-clock-widget">
              <div class="clock-display" data-clock-display title="클릭하여 시계 스타일 변경"></div>
            </div>
          </div>
        </div>

        <div class="settings-tabs">
          <button class="settings-tab-btn logs-tab-btn active" data-logs-tab="activity" type="button">활동 이력</button>
          <button class="settings-tab-btn logs-tab-btn" data-logs-tab="system" type="button">시스템 로그</button>
        </div>

        <!-- 탭 1: 활동 이력 -->
        <div class="card logs-tab-panel active" id="logs-tab-activity">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="margin:0; font-size:16px;">최근 활동 내역</h2>
            <button id="logs-activity-refresh-btn" class="secondary"
              style="font-size: 13px; padding: 6px 12px;">새로고침</button>
          </div>
          <p class="muted" style="margin-bottom:16px; font-size:13px;">최근 활동 로그가 최신 순으로 표시됩니다.</p>
          <ul id="logs-activity-timeline" class="activity-timeline"
            style="list-style: none; padding: 0; margin: 0; max-height: 620px; overflow-y: auto;">
            <li class="timeline-empty" style="padding: 12px; color: #64748b; text-align: center; font-size: 14px;">로그를
              불러오는 중입니다...</li>
          </ul>
        </div>

        <!-- 탭 2: 시스템 디버그 로그 -->
        <div class="card logs-tab-panel" id="logs-tab-system" style="display: none;">
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 16px;">
            <label style="font-size:14px; margin:0;">로그 파일 선택:</label>
            <select id="logs-system-file-select"
              style="padding: 6px 12px; font-size:14px; border-radius:4px; border:1px solid #cbd5e1; min-width:150px;">
              <option value="">파일을 불러오는 중...</option>
            </select>
            <button id="logs-system-refresh-btn" class="secondary" style="font-size: 13px; padding: 6px 12px;">현재 파일
              새로고침</button>
          </div>

          <div class="terminal-container"
            style="background-color: #0f172a; color: #f8fafc; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 13px; height: 68vh; min-height: 620px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;">
            <div id="logs-system-content">로그 파일을 선택해 주세요.</div>
          </div>
        </div>
      </section>
